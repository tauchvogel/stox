<!DOCTYPE html>
<html lang="de">

  <title>StoX | Melodic Techno &amp; Tech House DJ – Wetterau</title>

  <style>
    :root {
      --bg: #0a0b0e;
      --bg-elevated: #12141b;
      --bg-card: #161923;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --radius: 14px;
      --max-w: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 11, 14, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    nav a:hover {
      color: var(--text);
    }

    /* Layout & Sections */
    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 5.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    h2 {
      font-size: clamp(1.75rem, 3vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .section-intro {
      color: var(--text-muted);
      max-width: 660px;
      margin-bottom: 2.75rem;
    }

    /* Hero */
    .hero {
      padding: 6.5rem 0 6rem;
      background:
        radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.14), transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(129, 140, 248, 0.12), transparent 45%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 3rem;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.38rem 0.85rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5.5vw, 4.3rem);
      font-weight: 850;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .hero h1 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 560px;
      margin-bottom: 2rem;
    }

      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }
