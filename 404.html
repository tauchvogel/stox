*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0a0a0c;color:#f3f4f6;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden;position:relative}
body::before,body::after{content:"";position:absolute;width:24rem;height:24rem;border-radius:50%;filter:blur(120px);pointer-events:none}
body::before{top:10%;left:-8rem;background:rgba(0,240,255,.15)}
body::after{bottom:10%;right:-8rem;background:rgba(176,38,255,.15)}
main{position:relative;z-index:1;max-width:32rem}
.logo{display:block;width:min(18rem,80vw);aspect-ratio:525/169;margin:0 auto 2rem;background:var(--stox-logo) center/contain no-repeat}
.code{font:800 clamp(4rem,18vw,7rem)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:linear-gradient(135deg,#00f0ff,#b026ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
h1{font-size:1.5rem;margin:.75rem 0 .5rem}
p{color:#9ca3af;line-height:1.6;margin:0 0 2rem;font-size:.95rem}
a.btn{display:inline-block;padding:.9rem 2rem;border-radius:999px;background:linear-gradient(90deg,#00f0ff,#b026ff);color:#0a0a0c;font-weight:800;text-decoration:none;letter-spacing:.03em}
a.btn:hover{opacity:.9}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
<span class="logo" role="img" aria-label="DJ StoX"></span>
<p class="code" aria-hidden="true">404</p>

<p>Die Seite wurde nicht gefunden oder ist umgezogen. Zurück zum Dancefloor?</p>
<a id="home" class="btn" href="/">Zur Startseite</a>
</main>

</script>
